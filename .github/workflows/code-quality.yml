name: Source quality
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source and inherited utility regressions
        run: |
          bun run build
          bun run lint
          bun run check:translations
          bun run check:model-languages
          bun run check:catalog
          bun run test:keyboard
          node --test tests/robey-voice-config.test.mjs tests/robey-isolation.test.mjs
          bun src/components/update-checker/portableInstaller.test.ts
          bun src/components/settings/history/clipboard.test.ts
          bun scripts/robey-license-inventory.mjs --frontend-only
      - name: Check tracked frontend and workflow formatting
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z -- src scripts tests .github '*.json' '*.ts' '*.js' '*.mjs' '*.yml' '*.yaml' |
            python3 -c 'import sys; files=sys.stdin.buffer.read().split(b"\0"); sys.stdout.buffer.write(b"\0".join(p for p in files if p and p != b"src/bindings.ts" and p != b"src-tauri/src/catalog/catalog.json" and p.endswith((b".ts",b".tsx",b".js",b".jsx",b".mjs",b".json",b".yml",b".yaml",b".css",b".html")))+b"\0")' |
            xargs -0 bun x --no-install prettier --check --ignore-unknown
