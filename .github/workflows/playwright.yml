name: Browser source checks
run-name: Browser source checks at ${{ github.sha }}
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        "src/**",
        "tests/**",
        "package.json",
        "bun.lock",
        "playwright.config.*",
        ".github/workflows/playwright.yml",
      ]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun x --no-install playwright install --with-deps chromium
      - run: bun run test:playwright
      - name: Retain synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
